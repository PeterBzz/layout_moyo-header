<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta
      http-equiv="X-UA-Compatible"
      content="ie=edge"
    />
    <title>Moyo header</title>
    <link
      rel="stylesheet"
      href="./style.css"
    />
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header>
      <a
        class="logo"
        href="index.html"
      >
        <img
          src="images/logo.png"
          alt="logo"
        />
      </a>
      <nav>
        <ul class="nav-list">
          <li>
            <a
              href="https://google.com"
              class="link apple first is-active"
            >
              apple
            </a>
          </li>
          <li>
            <a
              href="https://google.com"
              class="link samsung"
            >
              samsung
            </a>
          </li>
          <li>
            <a
              href="https://google.com"
              class="link smartphones"
            >
              smartphones
            </a>
          </li>
          <li>
            <a
              href="https://google.com"
              class="link laptops-and-computers"
              data-qa="hover"
            >
              laptops & computers
            </a>
          </li>
          <li>
            <a
              href="https://google.com"
              class="link gadgets"
            >
              gadgets
            </a>
          </li>
          <li>
            <a
              href="https://google.com"
              class="link tablets"
            >
              tablets
            </a>
          </li>
          <li>
            <a
              href="https://google.com"
              class="link photo"
            >
              photo
            </a>
          </li>
          <li>
            <a
              href="https://google.com"
              class="link video last"
            >
              video
            </a>
          </li>
        </ul>
      </nav>
      <div class="right-margin"></div>
    </header>
  </body>
</html>
